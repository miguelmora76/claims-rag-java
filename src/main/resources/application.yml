server:
  port: ${PORT:8080}        # port binding comes from the environment
  shutdown: graceful        # finish in-flight requests on SIGTERM

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness and /actuator/health/readiness
  endpoints:
    web:
      exposure:
        include: health,prometheus

assistant:
  eval-report-dir: ${EVAL_REPORT_DIR:eval-report}
  provider: fake
  model: claude-opus-5-5
  judge-model: claude-haiku-4-5
  max-tokens: 1024
  effort: low        # blank to omit; Haiku/older models reject the effort param
  top-k: 3
  min-score: 0.08
  pricing:           # USD per 1M tokens; copied from published rates, verify before relying on it
    claude-opus-5-5:   { input-per-million: 4.00, output-per-million: 20.00, cache-read-per-million: 0.20, cache-write-per-million: 5.00 }
    claude-haiku-4-5:  { input-per-million: 1.00, output-per-million: 5.00,  cache-read-per-million: 0.10, cache-write-per-million: 1.25 }
